// mtheme userscript loader: runs ~/.config/mtui/scripts/*.js in the pages they name.
// A script's header says where:  // @domain example.com   (any number of lines; subdomains match)
// Scripts are read when Firefox starts. They run at DOMContentLoaded in the top frame with `window`,
// `document` and the page's globals in scope, like a userscript manager would (no GM_* APIs).
// Page documents live in content processes, so this registers a frame script for every tab.
try {
  const home = Services.dirsvc.get("Home", Ci.nsIFile).path;
  const xdg = Services.env.exists("XDG_CONFIG_HOME") ? Services.env.get("XDG_CONFIG_HOME") : home + "/.config";
  const dir = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  dir.initWithPath(xdg + "/mtui/scripts");
  const scripts = [];
  const read = (f) => {
    const fis = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    fis.init(f, 0x01, 0, 0);
    const sis = Cc["@mozilla.org/scriptableinputstream;1"].createInstance(Ci.nsIScriptableInputStream);
    sis.init(fis);
    const bytes = sis.read(sis.available());
    sis.close();
    return decodeURIComponent(escape(bytes));
  };
  if (dir.exists() && dir.isDirectory()) {
    for (const f of dir.directoryEntries) {
      const file = f.QueryInterface(Ci.nsIFile);
      if (!file.leafName.endsWith(".js")) continue;
      try {
        const code = read(file);
        const domains = [...code.matchAll(/^\s*\/\/\s*@domain\s+(\S+)/gm)].map((m) => m[1].toLowerCase());
        if (domains.length) scripts.push({ name: file.leafName, domains, code });
      } catch (e) { Cu.reportError("mtheme script " + file.leafName + ": " + e); }
    }
  }
  if (scripts.length) {
    const frame = `
      const SCRIPTS = ${JSON.stringify(scripts)};
      addEventListener("DOMContentLoaded", (ev) => {
        try {
          const doc = ev.target;
          const win = doc.defaultView;
          if (!win || win !== content || !/^https?:$/.test(doc.location.protocol)) return;
          const host = doc.location.hostname.toLowerCase();
          for (const s of SCRIPTS) {
            if (!s.domains.some((d) => host === d || host.endsWith("." + d))) continue;
            try {
              const box = Cu.Sandbox(win, { sandboxPrototype: win, sameZoneAs: win, wantXrays: false, sandboxName: "mtheme " + s.name });
              Cu.evalInSandbox(s.code, box, "latest", "mtheme:" + s.name, 1);
            } catch (e) { Cu.reportError("mtheme script " + s.name + ": " + e); }
          }
        } catch (e) { Cu.reportError("mtheme loader: " + e); }
      }, true);`;
    Services.mm.loadFrameScript("data:application/javascript;charset=utf-8," + encodeURIComponent(frame), true, true);
  }
} catch (e) { Cu.reportError("mtheme autoconfig: " + e); }
